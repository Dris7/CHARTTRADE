[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

# Bump function timeout for the tRPC handler. The dashboard's regime engine
# hits 6 FRED series on the first cold request (subsequent requests come
# from the Blobs cache via `next: { revalidate: 1800 }`).
# Free/Hobby cap: 10–15 s. Pro: 26 s. We request 26 — Netlify caps to plan.
[functions."api/trpc/[trpc]"]
  timeout = 26
